#Trust Experience Settings
[TrustExpSettings]
	#Interval in ticks for passive trust gain checks (e.g., 20 for every second)
	passiveTrustGainInterval = 20
	#Probability for passive trust gain per interval (as a decimal, e.g., 0.01 for 1%)
	passiveTrustGainProbability = 0.01
	#Minimum trust XP loss when a new craving is assigned (replaces old craving)
	trustLossMin = 45
	#Maximum trust XP loss when a new craving is assigned (replaces old craving)
	trustLossMax = 100
	#Minimum trust XP loss when the owner hurts the slug
	trustLossOnOwnerHurtMin = 10
	#Maximum trust XP loss when the owner hurts the slug
	trustLossOnOwnerHurtMax = 20

#XP Food Settings
[XPFoodSettings]
	#Probability for gaining XP from XP food (as a decimal, e.g., 0.15 for 15%)
	xpFoodGainProbability = 0.15
	#Minimum Combat XP gained from XP food when probability succeeds
	xpFoodMinGain = 5
	#Maximum Combat XP gained from XP food when probability succeeds
	xpFoodMaxGain = 10
	#Multiplier increment per combat level for combat XP gained from XP food (e.g., 0.05 for +5% per level above level 1)
	xpFoodCombatLevelMultiplier = 0.1
	#Minimum Combat XP for common XP food
	combatCommonMinXp = 5
	#Maximum Combat XP for common XP food
	combatCommonMaxXp = 10
	#Minimum Combat XP for uncommon XP food
	combatUncommonMinXp = 15
	#Maximum Combat XP for uncommon XP food
	combatUncommonMaxXp = 25
	#Minimum Combat XP for rare XP food
	combatRareMinXp = 35
	#Maximum Combat XP for rare XP food
	combatRareMaxXp = 50
	#Minimum Combat XP for epic XP food
	combatEpicMinXp = 75
	#Maximum Combat XP for epic XP food
	combatEpicMaxXp = 100
	#Minimum Combat XP for legendary XP food
	combatLegendaryMinXp = 200
	#Maximum Combat XP for legendary XP food
	combatLegendaryMaxXp = 250
	#Minimum Trust XP for common XP food
	trustCommonMinXp = 5
	#Maximum Trust XP for common XP food
	trustCommonMaxXp = 10
	#Minimum Trust XP for uncommon XP food
	trustUncommonMinXp = 15
	#Maximum Trust XP for uncommon XP food
	trustUncommonMaxXp = 25
	#Minimum Trust XP for rare XP food
	trustRareMinXp = 35
	#Maximum Trust XP for rare XP food
	trustRareMaxXp = 50
	#Minimum Trust XP for epic XP food
	trustEpicMinXp = 75
	#Maximum Trust XP for epic XP food
	trustEpicMaxXp = 100
	#Minimum Trust XP for legendary XP food
	trustLegendaryMinXp = 200
	#Maximum Trust XP for legendary XP food
	trustLegendaryMaxXp = 250
	#Minimum eating time in seconds when fed trust or exp food
	minEatingTime = 30
	#Maximum eating time in seconds when fed trust or exp food
	maxEatingTime = 45
	#Percent of max HP healed when any food is eaten (0.25 = 25%)
	foodHealingPercent = 0.25

#Slug Entity General Settings
[SlugEntitySettings]
	#Max health bonus for 'the Ascendant' title
	ascendantMaxHealthBonus = 20.0
	#Movement speed reduction for 'the Patient' or 'the Sleepy' titles
	patientSleepyMovementSpeed = 0.19
	#Chance for 'the Grateful' title to give a gift when fed XP food (as a decimal, e.g., 0.10 for 10%)
	gratefulGiftGivingChance = 0.1
	#Healing amount when feeding craved food
	cravedFoodHealingAmount = 4.0
	#Damage avoidance chance for 'the Lucky' title (as a decimal, e.g., 0.5 for 50%)
	luckyDamageAvoidanceChance = 0.5
	#Maximum vertical spawn distance from nearest player in blocks
	maxVerticalSpawnDistance = 128.0
	#Probability for assigning 'Male' gender on spawn (as a decimal, e.g., 0.5 for 50/50; female will be 1 - this value)
	maleGenderProbability = 0.5

#General Entity Despawn Settings (for non-tameable entities)
[GeneralEntityDespawnSettings]
	#Ticks before despawn if no player nearby (e.g., 600 for 30s)
	generalNoPlayerDespawnTicks = 600
	#Despawn chance per tick if > far radius (divide by 20 for per second)
	generalFarDespawnChance = 0.01
	#Despawn chance per tick if between near and far radius (divide by 20 for per second)
	generalNearDespawnChance = 0.0033
	#Far despawn radius in blocks
	generalFarDespawnRadius = 64
	#Near despawn radius in blocks
	generalNearDespawnRadius = 32
	#Radius to search for nearest player in blocks
	generalPlayerSearchRadius = 128
	#Vertical distance threshold for instant despawn (for non-water mobs)
	generalVerticalDespawnRadius = 64

#Slug Despawn Settings (for untamed tamable slugs)
[SlugDespawnSettings]
	#Ticks before despawn if no player nearby (e.g., 600 for 30s)
	slugNoPlayerDespawnTicks = 600
	#Despawn chance per tick if > far radius (divide by 20 for per second)
	slugFarDespawnChance = 0.01
	#Despawn chance per tick if between near and far radius (divide by 20 for per second)
	slugNearDespawnChance = 0.0033
	#Far despawn radius in blocks
	slugFarDespawnRadius = 64
	#Near despawn radius in blocks
	slugNearDespawnRadius = 32
	#Radius to search for nearest player in blocks
	slugPlayerSearchRadius = 128
	#Vertical distance threshold for instant despawn (for non-water mobs)
	slugVerticalDespawnRadius = 64



#General Slug Leveling Settings
[SlugLevelingSettings]
	#Maximum level a slug can reach
	maxLevel = 20
	#Base XP needed for level 2
	baseXpNeeded = 20.0
	#Exponent for XP curve (higher = steeper curve)
	xpExponent = 1.2
	#Speed multiplier for velocimorph form
	velocimorphSpeedMultiplier = 1.025

#Combat Experience Settings
[CombatExpSettings]
	#Enable XP gain from impacts
	enableImpactExp = true
	#Multiplier for impact XP gain
	impactExpMultiplier = 1.0
	#Enable XP gain from killing players
	enableKillPlayerExp = true
	#Enable XP gain from hitting players
	enableHitPlayerExp = true
	#Multiplier for size scaling in XP calculation
	sizeScalingMultiplier = 1.0
	#Multiplier for kill impacts
	killImpactMultiplier = 2.0
	#Enable passive impact XP for non-player kills
	enablePassiveImpactExp = true
	#Multiplier for passive kills
	passiveKillMultiplier = 0.5
	#Show feedback when gaining combat XP from impacts
	ImpactCombatExpGainFeedback = true
	#Multiplier for XP gained in air
	airExpMultiplier = 1.5
	#List of slugs excluded from impact XP gain (registry names)
	excludedImpactExpSlugs = []

